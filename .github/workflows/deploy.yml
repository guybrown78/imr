name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Launch switch: set the Actions variable DEPLOY_ENABLED=true (repo or environment) to upload.
      - name: Deploy disabled
        if: vars.DEPLOY_ENABLED != 'true'
        run: echo "::notice::Built and tested only. Set the Actions variable DEPLOY_ENABLED=true to upload to the server."

      - name: Load SSH key
        if: vars.DEPLOY_ENABLED == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust host
        if: vars.DEPLOY_ENABLED == 'true'
        run: ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # --delete removes old files, but never touches certs, cPanel bits or the server-only config.
      - name: Upload
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          rsync -az --delete \
            --exclude '.well-known/' --exclude 'cgi-bin/' --exclude 'staging.imrservices.net/' --exclude '.user.ini' --exclude 'error_log' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ vars.DEPLOY_PATH || 'public_html' }}/"
