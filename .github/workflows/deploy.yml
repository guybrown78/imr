name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      SITE_PATH: ${{ vars.DEPLOY_PATH || 'public_html' }}   # static site
      API_PATH: ${{ vars.API_PATH || 'imr-api' }}           # Node app root, outside the web root
      SSH: ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      # Launch switch (DEPLOY_ENABLED=true) and upload method: 'ssh' (default, rsync) or 'ftps'.
      USE_SSH: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_METHOD != 'ftps' }}
      USE_FTPS: ${{ vars.DEPLOY_ENABLED == 'true' && vars.DEPLOY_METHOD == 'ftps' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Deploy disabled
        if: vars.DEPLOY_ENABLED != 'true'
        run: echo "::notice::Built and tested only. Set the Actions variable DEPLOY_ENABLED=true to upload to the server."

      # ── SSH (rsync) ─────────────────────────────────────────────────

      - name: Load SSH key
        if: env.USE_SSH == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust host
        if: env.USE_SSH == 'true'
        run: ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # cPanel writes the Node app's Passenger block into .htaccess; keep a copy so the upload can't wipe it.
      - name: Save cPanel Node.js config
        if: env.USE_SSH == 'true'
        run: |
          $SSH "blk=\$(sed -n '/PASSENGER CONFIGURATION BEGIN/,/PASSENGER CONFIGURATION END/p' $SITE_PATH/.htaccess 2>/dev/null); \
                if [ -n \"\$blk\" ]; then printf '%s\n' \"\$blk\" > ~/.imr-passenger.htaccess; fi"

      # --delete removes old files, but never touches certs, cPanel bits or the API route.
      - name: Upload site
        if: env.USE_SSH == 'true'
        run: |
          rsync -az --delete \
            --exclude '.well-known/' --exclude 'cgi-bin/' --exclude 'staging.imrservices.net/' --exclude '/api/' \
            --exclude '.user.ini' --exclude 'error_log' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$SITE_PATH/"
          $SSH "if [ -s ~/.imr-passenger.htaccess ]; then cat ~/.imr-passenger.htaccess $SITE_PATH/.htaccess > $SITE_PATH/.htaccess.tmp && mv $SITE_PATH/.htaccess.tmp $SITE_PATH/.htaccess; fi"

      - name: Upload API
        if: env.USE_SSH == 'true'
        run: |
          rsync -az --delete \
            --exclude 'node_modules' --exclude 'tmp/' --exclude '.env' --exclude '*.log' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            server/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$API_PATH/"

      # Install packages inside cPanel's Node environment, then tell Passenger to restart the app.
      - name: Install and restart API
        if: env.USE_SSH == 'true'
        run: |
          $SSH "set -e; cd ~/$API_PATH; \
                act=\$(ls -d ~/nodevenv/$API_PATH/*/bin/activate 2>/dev/null | tail -1); \
                if [ -z \"\$act\" ]; then echo 'No cPanel Node.js app found for ~/$API_PATH. Create it in Setup Node.js App first.'; exit 1; fi; \
                . \"\$act\"; npm install --omit=dev --no-audit --no-fund; mkdir -p tmp; touch tmp/restart.txt"

      # ── FTPS (fallback when the host blocks SSH from GitHub) ────────
      # FTP_USER is a cPanel FTP account whose directory is the home folder, so it can reach
      # public_html/ and imr-api/. Only files this workflow uploaded are ever deleted; anything
      # else on the server (public_html/api/, .well-known/, old files) is left alone.

      - name: Check FTPS login
        if: env.USE_FTPS == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.SSH_HOST }}
          FTP_AUTH: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}
        run: curl -fsS --ssl-reqd --max-time 30 --list-only -u "$FTP_AUTH" "ftp://$FTP_HOST/" > /dev/null

      # The API's packages are plain JavaScript, so they are installed here and uploaded as files.
      - name: Install API packages
        if: env.USE_FTPS == 'true'
        run: npm ci --omit=dev --no-audit --no-fund --prefix server

      - name: Upload site (FTPS)
        if: env.USE_FTPS == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.SITE_PATH }}/
          log-level: minimal

      - name: Upload API (FTPS)
        if: env.USE_FTPS == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          security: strict
          port: 21
          local-dir: ./server/
          server-dir: ${{ env.API_PATH }}/
          exclude: |
            .env
            **/*.log
            tmp/**
          log-level: minimal

      # Uploaded last, so the app restarts only once every file is in place.
      - name: Restart API (FTPS)
        if: env.USE_FTPS == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || secrets.SSH_HOST }}
          FTP_AUTH: ${{ secrets.FTP_USER }}:${{ secrets.FTP_PASS }}
        run: |
          date -u > restart.txt
          curl -fsS --ssl-reqd --ftp-create-dirs -u "$FTP_AUTH" -T restart.txt "ftp://$FTP_HOST/$API_PATH/tmp/restart.txt"

      - name: Check API is up
        if: vars.DEPLOY_ENABLED == 'true' && github.ref_name == 'main'
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://imrservices.net/api/health/
